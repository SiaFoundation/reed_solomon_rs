[package]
name = "sia_reed_solomon_comparisons"
version = "0.0.0"
edition = "2024"
publish = false
description = "Cross-crate Reed-Solomon benchmarks (not published)"

[lib]
path = "src/lib.rs"
bench = false

[features]
default = ["simd", "parallel"]
simd = ["sia_reed_solomon/simd", "reed-solomon-erasure/simd-accel"]
parallel = ["sia_reed_solomon/parallel"]

[dev-dependencies]
sia_reed_solomon = { path = "..", default-features = false }
reed-solomon-erasure = { version = "6.0.0", default-features = false, features = ["std"] }
criterion = { version = "0.8.2", features = ["html_reports"] }
rand = "0.10.1"
reed-solomon-simd = "3.1.0"

[[bench]]
name = "comparisons"
harness = false
