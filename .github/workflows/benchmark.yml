name: Benchmark

# Manual only. Bare-metal SKUs are slow to provision and not cheap.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bench:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      # Serialize: 4xlarge is 16 vCPU; three in parallel (48) would exceed
      # the account's 32-vCPU on-demand quota and leave one job to fail.
      max-parallel: 1
      matrix:
        include:
          # Skylake-SP: AVX2 yes, GFNI no.
          - name: AVX2 (c5.4xlarge)
            slug: avx2-c5-4xlarge
            runner: runs-on=${{ github.run_id }}/family=c5.4xlarge/image=ubuntu24-full-x64
            scalar: false
          # Sapphire Rapids: AVX2 + GFNI; dispatcher picks GFNI. Scalar
          # baseline runs here only — one reference point is enough.
          - name: GFNI (c7i.4xlarge)
            slug: gfni-c7i-4xlarge
            runner: runs-on=${{ github.run_id }}/family=c7i.4xlarge/image=ubuntu24-full-x64
            scalar: true
          # Graviton 3: aarch64 NEON.
          - name: NEON (c7g.4xlarge)
            slug: neon-c7g-4xlarge
            runner: runs-on=${{ github.run_id }}/family=c7g.4xlarge/image=ubuntu24-full-arm64
            scalar: false
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      - name: Show CPU
        run: |
          uname -a
          grep -m1 -E 'model name|Hardware|Model' /proc/cpuinfo || true
          echo "nproc: $(nproc)"
      - name: Setup Rust
        run: rustup update stable
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: comparisons/klauspost-go/go.mod
      - name: Prepare output dir
        run: mkdir -p out
      # Criterion writes to target/criterion/<group>/<fn>/<id>; the main bench
      # and the comparison bench share group + fn names, so we move it between
      # runs to keep the reports separate.
      - name: Bench (SIMD)
        run: |
          cargo bench --bench reed_solomon 2>&1 | tee out/bench-simd.txt
          mv target/criterion out/criterion-simd
      - name: Bench (scalar)
        if: matrix.scalar
        run: |
          cargo bench --no-default-features --features parallel --bench reed_solomon 2>&1 | tee out/bench-scalar.txt
          mv target/criterion out/criterion-scalar
      - name: Bench (cross-crate comparison)
        run: |
          cargo bench -p sia_reed_solomon_comparisons 2>&1 | tee out/bench-comparison.txt
          mv target/criterion out/criterion-comparison
      - name: Bench (klauspost Go)
        working-directory: comparisons/klauspost-go
        run: |
          go mod tidy
          go test -bench . -benchtime=5s ./... 2>&1 | tee ../../out/bench-klauspost-go.txt
      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: bench-${{ matrix.slug }}
          path: out/
  merge:
    name: Merge bench artifacts
    needs: bench
    runs-on: ubuntu-latest
    steps:
      - uses: actions/upload-artifact/merge@v7
        with:
          name: bench
          pattern: bench-*
          separate-directories: true
          delete-merged: true
