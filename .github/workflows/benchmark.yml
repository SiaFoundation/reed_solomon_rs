name: Benchmark

# Manual only. Bare-metal SKUs are slow to provision and not cheap.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bench:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Skylake-SP: AVX2 yes, GFNI no.
          - name: AVX2 (c5.4xlarge)
            slug: avx2-c5-4xlarge
            runner: runs-on=${{ github.run_id }}/family=c5.4xlarge/image=ubuntu24-full-x64
            flags: ""
            label: simd
            compare: true
          # Sapphire Rapids: AVX2 + GFNI; dispatcher picks GFNI.
          - name: GFNI (c7i.4xlarge)
            slug: gfni-c7i-4xlarge
            runner: runs-on=${{ github.run_id }}/family=c7i.4xlarge/image=ubuntu24-full-x64
            flags: ""
            label: simd
            compare: true
          # Scalar baseline (SIMD off, parallel kept).
          - name: scalar (c7i.4xlarge)
            slug: scalar-c7i-4xlarge
            runner: runs-on=${{ github.run_id }}/family=c7i.4xlarge/image=ubuntu24-full-x64
            flags: --no-default-features --features parallel
            label: scalar
            compare: false
          # No optional features at all.
          - name: no features (c7i.4xlarge)
            slug: no-features-c7i-4xlarge
            runner: runs-on=${{ github.run_id }}/family=c7i.4xlarge/image=ubuntu24-full-x64
            flags: --no-default-features
            label: no-features
            compare: false
          # Graviton 3: aarch64 NEON.
          - name: NEON (c7g.4xlarge)
            slug: neon-c7g-4xlarge
            runner: runs-on=${{ github.run_id }}/family=c7g.4xlarge/image=ubuntu24-full-arm64
            flags: ""
            label: simd
            compare: true
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Show CPU
        run: |
          uname -a
          grep -m1 -E 'model name|Hardware|Model' /proc/cpuinfo || true
          echo "nproc: $(nproc)"
      - name: Setup Rust
        run: rustup update stable
      - name: Setup Go
        if: matrix.compare
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: comparisons/klauspost-go/go.mod
      - name: Prepare output dir
        run: mkdir -p out
      # Criterion writes to target/criterion/<group>/<fn>/<id>; the main bench
      # and the comparison bench share group + fn names, so we move it between
      # runs to keep the reports separate.
      - name: Bench
        run: |
          cargo bench ${{ matrix.flags }} --bench reed_solomon 2>&1 | tee out/bench-${{ matrix.label }}.txt
          mv target/criterion out/criterion-${{ matrix.label }}
      - name: Bench (cross-crate comparison)
        if: matrix.compare
        run: |
          cargo bench -p sia_reed_solomon_comparisons 2>&1 | tee out/bench-comparison.txt
          mv target/criterion out/criterion-comparison
      - name: Bench (klauspost Go)
        if: matrix.compare
        working-directory: comparisons/klauspost-go
        run: |
          go mod tidy
          go test -bench . -benchtime=5s ./... 2>&1 | tee ../../out/bench-klauspost-go.txt
      - name: Upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bench-${{ matrix.slug }}
          path: out/

  # Same SKU as the "no features" matrix entry so the wasm and scalar
  # numbers share a host CPU.
  wasm:
    name: WASM (Node / c7i.4xlarge)
    runs-on: runs-on=${{ github.run_id }}/family=c7i.4xlarge/image=ubuntu24-full-x64
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Show CPU
        run: |
          uname -a
          grep -m1 -E 'model name|Hardware|Model' /proc/cpuinfo || true
          node --version
      - name: Setup Rust
        run: |
          rustup update stable
          rustup target add wasm32-unknown-unknown
      - name: Install wasm-pack
        run: cargo install --locked wasm-pack
      - name: Prepare output dir
        run: mkdir -p out
      - name: Bench (wasm32, scalar)
        working-directory: bench-wasm
        run: |
          wasm-pack build --target nodejs --release
          node run.mjs 2>&1 | tee ../out/bench-wasm-scalar.txt
      - name: Bench (wasm32, simd128)
        working-directory: bench-wasm
        env:
          RUSTFLAGS: "-C target-feature=+simd128"
        run: |
          rm -rf pkg
          wasm-pack build --target nodejs --release --features simd
          node run.mjs 2>&1 | tee ../out/bench-wasm-simd.txt
      - name: Upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bench-wasm-c7i-4xlarge
          path: out/

  merge:
    name: Merge bench artifacts
    needs: [bench, wasm]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/upload-artifact/merge@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bench
          pattern: bench-*
          separate-directories: true
          delete-merged: true
