name: Main

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    # 04:07 UTC daily. Offset a few minutes off the top of the hour to avoid
    # the GitHub-wide cron stampede.
    - cron: "7 4 * * *"

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: tenki-standard-medium-4c-8g
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Environment
        run: |
          rustup update stable
          rustup toolchain install nightly
          rustup target add wasm32-unknown-unknown
          rustup component add rustfmt --toolchain nightly
      - name: Rustfmt
        run: cargo +nightly fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Clippy (no default features)
        run: cargo clippy --all-targets --no-default-features -- -D warnings
      - name: Clippy (wasm)
        run: cargo clippy --target wasm32-unknown-unknown --lib -- -D warnings
      - name: Clippy (wasm, no default features)
        run: cargo clippy --target wasm32-unknown-unknown --lib --no-default-features -- -D warnings
      - name: Build docs
        run: cargo doc --all-features --no-deps
        env:
          RUSTDOCFLAGS: "-D warnings"
      - name: Build benches
        run: cargo build --benches

  test:
    name: Test ${{ matrix.os }} (${{ matrix.variant }})
    strategy:
      fail-fast: false
      matrix:
        os: [tenki-standard-medium-4c-8g, macos-latest, windows-latest]
        variant: [default, no-simd, scalar]
        include:
          - variant: default
            flags: ""
          - variant: no-simd
            flags: "--no-default-features --features parallel"
          - variant: scalar
            flags: "--no-default-features"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Rust
        run: rustup update stable
      - name: Test
        run: cargo test ${{ matrix.flags }}

  wasm:
    name: Test WASM (${{ matrix.browser }}, ${{ matrix.variant }})
    env:
      WASM_BINDGEN_TEST_TIMEOUT: "300"
      # Picks browser mode at runtime instead of baking it into the wasm
      # binary via `wasm_bindgen_test_configure!`. Lets the same binary be
      # routed to node/deno/workers in a future matrix.
      WASM_BINDGEN_USE_BROWSER: "1"
    strategy:
      fail-fast: false
      matrix:
        browser: [chrome, firefox]
        variant: [simd128, scalar]
        include:
          - variant: simd128
            flags: ""
          - variant: scalar
            flags: "--no-default-features"
    runs-on: tenki-standard-medium-4c-8g
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Rust
        run: |
          rustup update stable
          rustup target add wasm32-unknown-unknown
          cargo install wasm-pack
      - name: Test
        run: wasm-pack test --${{ matrix.browser }} --headless -- ${{ matrix.flags }}

  simd:
    name: Test SIMD (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # Skylake-SP / Zen 2-3 era: AVX2 yes, GFNI no.
          - name: AVX2
            slug: avx2
            runner: runs-on=${{ github.run_id }}/family=c5/image=ubuntu24-full-x64
            arch: x86_64
            require: avx2
            disallow: gfni
          # Sapphire Rapids: has AVX2 + GFNI; dispatcher picks GFNI.
          - name: GFNI
            slug: gfni
            runner: runs-on=${{ github.run_id }}/family=c7i/image=ubuntu24-full-x64
            arch: x86_64
            require: gfni
            disallow: ""
          # Graviton 4: second aarch64 data point.
          - name: NEON (Graviton 4)
            slug: neon-g4
            runner: runs-on=${{ github.run_id }}/family=c8g/image=ubuntu24-full-arm64
            arch: aarch64
            require: asimd
            disallow: ""
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Confirm CPU features
        run: |
          set -e
          echo "uname: $(uname -a)"
          grep -m1 -E 'model name|Hardware|Model' /proc/cpuinfo || true
          if [ "${{ matrix.arch }}" = "x86_64" ]; then
            features=$(grep -m1 '^flags' /proc/cpuinfo | sed 's/.*: //')
          else
            features=$(grep -m1 '^Features' /proc/cpuinfo | sed 's/.*: //')
          fi
          echo "Detected features: $features"
          if ! echo " $features " | grep -qw "${{ matrix.require }}"; then
            echo "FAIL: required CPU feature '${{ matrix.require }}' not present on this runner"
            exit 1
          fi
          echo "OK: '${{ matrix.require }}' present"
          if [ -n "${{ matrix.disallow }}" ]; then
            if echo " $features " | grep -qw "${{ matrix.disallow }}"; then
              echo "FAIL: runner has '${{ matrix.disallow }}'; dispatcher would skip the path under test"
              exit 1
            fi
            echo "OK: '${{ matrix.disallow }}' absent"
          fi
      - name: Setup Rust
        run: |
          # install the toolchain from scratch instead of updating
          # fixes an issue: 
          #   error: could not rename 'component' file from '/home/runner/.rustup/toolchains/stable-x86_64-unknown-linux-gnu/share/doc/clippy' to '/home/runner/.rustup/tmp/011h_1rx77g7pqjl_dir/bk': Invalid cross-device link (os error 18): Invalid cross-device link (os error 18)
          rustup self update
          rm -rf ~/.rustup 
          rustup toolchain install stable
      - name: Test
        run: cargo test
      - name: Test (SIMD off)
        run: cargo test --no-default-features --features parallel

  # Aggregate check for branch protection: a single required status that
  # depends on every matrix expansion of the jobs above.
  success:
    name: Success
    needs: [lint, test, wasm, simd]
    runs-on: ubuntu-latest
    steps:
      - run: echo "success"
