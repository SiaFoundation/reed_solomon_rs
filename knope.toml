[changes]
ignore_conventional_commits = true

[packages.sia_reed_solomon]
versioned_files = [
    "Cargo.toml",
    { path = "Cargo.lock", dependency = "sia_reed_solomon" }
]
changelog = "CHANGELOG.md"

[[workflows]]
name = "document-change"

[[workflows.steps]]
type = "CreateChangeFile"

[[workflows]]
name = "prepare-release"

[[workflows.steps]]
type = "PrepareRelease"

[[workflows]]
name = "release"

[[workflows.steps]]
type = "Release"

[github]
owner = "SiaFoundation"
repo = "reed_solomon_rs"
