[package]
name = "sia_reed_solomon"
version = "0.2.0"
edition = "2024"
rust-version = "1.90"
repository = "https://github.com/SiaFoundation/reed_solomon_rs"
license = "MIT"
description = "Reed-Solomon erasure coding over GF(2^8), translated from Klaus Post's reedsolomon Go library"
authors = ["The Sia Foundation"]
categories = ["algorithms", "encoding"]
keywords = ["reed-solomon", "erasure-coding", "galois", "sia"]
readme = "README.md"
exclude = ["knope.toml", ".changeset/*", ".github/*"]

[lib]
path = "src/lib.rs"
bench = false

[features]
default = ["parallel", "simd"]
# Cross-shard and intra-shard parallelism via rayon. Disable for WASM targets
# where threads aren't available.
parallel = ["dep:rayon"]
# Runtime-dispatched AVX2 / GFNI / NEON paths. Disable for benchmarking the
# scalar fallback, binary-size trimming, or as an escape hatch for suspected
# SIMD bugs. WASM and other non-x86/aarch64 targets fall through to scalar
# regardless of this flag.
simd = []

[dependencies]
thiserror = "2.0.18"
rayon = { version = "1.11", optional = true }
cfg-if = "1.0"

[dev-dependencies]
criterion = { version = "0.8.2", features = ["html_reports"] }
rand = "0.10.1"
getrandom = "0.4"

[[bench]]
name = "reed_solomon"
harness = false

# Cross-crate comparison benches; run with:
#   cargo bench -p sia_reed_solomon_comparisons
[workspace]
members = ["comparisons"]
