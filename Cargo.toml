[package]
name = "sia_reed_solomon"
version = "0.3.0"
edition = "2024"
rust-version = "1.90"
repository = "https://github.com/SiaFoundation/reed_solomon_rs"
license = "MIT"
description = "Reed-Solomon erasure coding over GF(2^8), translated from Klaus Post's reedsolomon Go library"
authors = ["The Sia Foundation"]
categories = ["algorithms", "encoding"]
keywords = ["reed-solomon", "erasure-coding", "galois", "sia"]
readme = "README.md"
exclude = ["knope.toml", ".changeset/*", ".github/*"]

[lib]
path = "src/lib.rs"
bench = false
crate-type = ["cdylib", "rlib"]

[features]
default = ["parallel", "simd"]
# Cross-shard and intra-shard parallelism via rayon. Automatically disabled on `wasm32`.
parallel = ["dep:rayon"]
# Runtime-dispatched AVX2 / GFNI / NEON / SIMD128 paths. Unsupported targets
# fall through to scalar regardless of this flag.
simd = []

[dependencies]
thiserror = "2.0.18"
cfg-if = "1.0"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rayon = { version = "1.11", optional = true }

[dev-dependencies]
rand = "0.10.1"
getrandom = "0.4"
blake2 = "0.10"
hex-literal = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
criterion = { version = "0.8.2", features = ["html_reports"] }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"
getrandom = { version = "0.4", features = ["wasm_js"] }

[[bench]]
name = "reed_solomon"
harness = false

# Cross-crate comparison benches; run with:
#   cargo bench -p sia_reed_solomon_comparisons
[workspace]
members = ["comparisons", "comparisons/bench-wasm", "bench-wasm"]

# CPU-intensive operations are ~100x slower without
# optimizations. WASM tests are flaky without this
# due to ChromeDriver having a hardcoded 30s timeout.
[profile.test]
opt-level = 3
